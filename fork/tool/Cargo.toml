[package]
name = "andarium_max"
version = "0.1.0"
edition = "2021"
description = "Measures and tunes an Andarium Android guest over adb. Made by Claude Strife - X"
license = "GPL-2.0-or-later"

[[bin]]
name = "AndariumMax"
path = "src/main.rs"

# No dependencies on purpose: the tool builds offline and its logic is tested
# on any host with `cargo test`.
[dependencies]

[profile.release]
opt-level = 2
